name: Validate Helm Charts

on:
  push:
    branches:
      - main
    paths:
      - colorapp/**
      - votingapp/**
      - .github/workflows/chart-validation.yaml
  pull_request:
    paths:
      - colorapp/**
      - votingapp/**
      - .github/workflows/chart-validation.yaml
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Validate chart structure
        run: scripts/validate-charts.sh