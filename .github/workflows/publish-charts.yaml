name: Build and Publish Helm Charts

on:
  push:
    branches:
      - main
    paths:
      - colorapp/**
      - votingapp/**
      - README.md
      - PUBLISH.md
      - .github/workflows/publish-charts.yaml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed charts
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            mapfile -t chart_dirs < <(
              git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" \
                | awk -F/ '/^(colorapp|votingapp)\// {print $1}' \
                | sort -u
            )
          else
            mapfile -t chart_dirs < <(
              find . -mindepth 1 -maxdepth 1 -type d \( -name colorapp -o -name votingapp \) -printf '%f\n' | sort
            )
          fi

          if [[ ${#chart_dirs[@]} -eq 0 ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "${chart_dirs[@]}" > chart_dirs.txt
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Package changed charts
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          mapfile -t chart_dirs < chart_dirs.txt

          for chart_dir in "${chart_dirs[@]}"; do
            chart_name=$(awk -F': *' '/^name:/ {print $2; exit}' "${chart_dir}/Chart.yaml")
            chart_version=$(awk -F': *' '/^version:/ {print $2; exit}' "${chart_dir}/Chart.yaml")

            if [[ -z "${chart_name}" || -z "${chart_version}" ]]; then
              echo "Missing name or version in ${chart_dir}/Chart.yaml" >&2
              exit 1
            fi

            if [[ "${chart_name}" != "${chart_dir}" ]]; then
              echo "Chart name ${chart_name} does not match folder name ${chart_dir}" >&2
              exit 1
            fi

            echo "Packaging ${chart_name} version ${chart_version}"

            helm package "${chart_dir}" --destination dist

            if [[ ! -f "dist/${chart_name}-${chart_version}.tgz" ]]; then
              echo "Expected package dist/${chart_name}-${chart_version}.tgz was not created" >&2
              exit 1
            fi
          done

      - name: Generate repository index
        if: steps.changes.outputs.changed == 'true'
        run: |
          helm repo index dist --url https://ritexlabs.github.io/chart-shelf/

      - name: Validate repository index
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          ruby -e '
            require "yaml"

            index = YAML.load_file("dist/index.yaml")

            unless index.is_a?(Hash) && index["apiVersion"] == "v1" && index.key?("entries") && index.key?("generated")
              abort("dist/index.yaml has an unexpected top-level structure")
            end

            entries = index["entries"]
            unless entries.is_a?(Hash) && entries.all? { |_name, versions| versions.is_a?(Array) }
              abort("dist/index.yaml entries must map chart names to version arrays")
            end
          '

      - name: Add GitHub Pages landing page
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          cat > dist/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <meta http-equiv="refresh" content="0; url=./index.yaml" />
              <title>chart-shelf</title>
            </head>
            <body>
              <p>
                Helm repository for chart-shelf is available at
                <a href="./index.yaml">index.yaml</a>.
              </p>
            </body>
          </html>
          EOF

      - name: Add nojekyll marker
        if: steps.changes.outputs.changed == 'true'
        run: touch dist/.nojekyll

      - name: Publish to GitHub Pages
        if: steps.changes.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages